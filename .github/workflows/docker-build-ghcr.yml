name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - feat/subscription-owner-group
  workflow_dispatch:

concurrency:
  group: ghcr-new-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.repository == 'ki0307/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::VERSION is not a valid Docker tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ki0307/new-api:latest
            ghcr.io/ki0307/new-api:${{ steps.image.outputs.version }}
            ghcr.io/ki0307/new-api:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ki0307/new-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=new-api-amd64
          cache-to: type=gha,scope=new-api-amd64,mode=max

      - name: Image summary
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker image (linux/amd64)'
            echo "ghcr.io/ki0307/new-api:$IMAGE_VERSION"
            echo "ghcr.io/ki0307/new-api:$IMAGE_SHA"
            echo "Digest: $IMAGE_DIGEST"
            echo 'Server command: `docker pull ghcr.io/ki0307/new-api:latest`'
          } >> "$GITHUB_STEP_SUMMARY"
