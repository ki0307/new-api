name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - feat/subscription-owner-group
  workflow_dispatch:

concurrency:
  group: ghcr-new-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify-backend:
    if: github.repository == 'ki0307/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      TEST_MYSQL_DSN: 'root:integration-test@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres:integration-test@127.0.0.1:5432/newapi_test?sslmode=disable'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Verify subscription groups and schema migrations on all databases
        run: go test ./model -run 'TestOwnerGroupDatabaseMatrix|TestMigrationSchemaStability' -count=1 -timeout=5m -v
      - name: Test model, billing service and controller integration
        run: go test -p 1 ./model ./service ./controller -count=1 -timeout=10m

  build-and-push:
    if: github.repository == 'ki0307/new-api'
    needs: verify-backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::VERSION is not a valid Docker tag"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ki0307/new-api:latest
            ghcr.io/ki0307/new-api:${{ steps.image.outputs.version }}
            ghcr.io/ki0307/new-api:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ki0307/new-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=new-api-amd64
          cache-to: type=gha,scope=new-api-amd64,mode=max

      - name: Image summary
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker image (linux/amd64)'
            echo "ghcr.io/ki0307/new-api:$IMAGE_VERSION"
            echo "ghcr.io/ki0307/new-api:$IMAGE_SHA"
            echo "Digest: $IMAGE_DIGEST"
            echo 'Server command: `docker pull ghcr.io/ki0307/new-api:latest`'
          } >> "$GITHUB_STEP_SUMMARY"
